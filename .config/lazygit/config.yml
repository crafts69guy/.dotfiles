customCommands:
  - key: 'C'
    command: 'git cz'
    description: 'commit with commitizen'
    context: 'files'
    loadingText: 'opening commitizen commit tool'
    output: terminal
os:
  # LazyGit runs inside a Herdr pane, so edit files with LazyVim in that same
  # terminal and return to LazyGit when Neovim exits.
  editPreset: nvim
gui:
  mouseEvents: true
  # Give the side-by-side diff more room without making the navigation panels
  # too narrow for repository paths and branch names.
  sidePanelWidth: 0.2
git:
  diffRenderers:
    - colorArg: always
      # no --dark: delta infers light/dark from the BAT_THEME hue mood, so
      # diffs follow hue-cung's light appearance too.
      # Wrap long lines without Delta's right-aligned ellipsis continuation.
      command: >-
        delta --paging=never --side-by-side
        --wrap-max-lines=unlimited --wrap-right-percent=0.01
        --wrap-left-symbol=' '
keybinding:
  universal:
    # Prefer the editor for source files; keep macOS's default-app action on O.
    edit: o
    openFile: O
