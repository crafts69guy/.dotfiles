onboarding = false
# herdr configuration — replaces tmux as the daily-driver multiplexer.
# See ~/.dotfiles/.claude/plans (or agent-rules/tools/herdr/) for the migration
# rationale. Full option reference: `herdr --default-config`.

[theme]
# name = "catppuccin"
name = "terminal"
auto_switch = false
# BEGIN hue-theme
[theme.custom]
# Generated by scripts/build.ts. Do not edit.
# Huế Mưa — Hue theme for herdr.
# apply.sh also copies `accent` into [ui].accent; keep it first.
accent = "#00CF6A"
panel_bg = "#0A2E52"
surface0 = "#123F6E"
surface1 = "#4E7AA6"
surface_dim = "#123F6E"
overlay0 = "#6B819A"
overlay1 = "#8CA3BD"
text = "#E5F4FF"
subtext0 = "#9DB4D4"
mauve = "#8A7BFF"
green = "#00CF6A"
yellow = "#FF8D00"
red = "#FF5A63"
blue = "#10B6F8"
teal = "#10B6F8"
peach = "#FF8D00"
# END hue-theme

[terminal]
# fish is the primary shell; empty default_shell falls back to $SHELL.
shell_mode = "login"
new_cwd = "follow"

[keys]
# tmux used ctrl+t as prefix (ctrl+b was unbound) — keep the same muscle memory.
prefix = "ctrl+t"

# reload_config, split_vertical/split_horizontal, focus_pane_*, and resize_mode
# all match herdr's defaults already and mirror tmux's vi-style h/j/k/l pane
# navigation, so they are left commented/default (see `herdr --default-config`).

# Workspace navigation mode: use vi-style vertical movement instead of arrows.
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# Workspace switching follows left/right vi movement.
previous_workspace = "prefix+ctrl+k"
next_workspace = "prefix+ctrl+j"

# Agent navigation mirrors the vi-style direction keys and tab number jumps.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+alt+1..9"

# Jump back to the previously focused pane without changing tab/workspace order.
last_pane = "prefix+backtick"

# Worktrees: add uses Herdr's default prefix+shift+g; double-tap t opens an
# existing one, and d deletes (shift+d stays close_workspace). prefix+a is
# reserved for the Switchboard AI Agents picker below.
open_worktree = "prefix+t"
remove_worktree = "prefix+d"

# goto moves off its prefix+g default to free that key for the git menu below.
goto = "prefix+alt+g"

# Best-effort analog of tmux's `bind F run-shell "open '#{pane_current_path}'"`.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "open ."
description = "Open current pane's directory in Finder"

# Switchboard central menu. Direct actions below keep every picker and utility
# reachable without nesting panes; alt reserves a collision-free plugin layer.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "switchboard.menu"
description = "Switchboard menu"

# Git menu (Switchboard, crafts69guy/herdr-switchboard): opens a herdr
# pane of its own for the repo the current pane sits in — d worktree, b branch,
# h commits, a all files, p pull request, r saved reviews, l lazygit, plus
# menu.conf customs. Reviews run in tuicr and take over that pane; quitting
# returns you here. This is the ONLY way in — the switcher's ⌥g is gone.
# Replaces the retired git-hub plugin. goto vacated prefix+g for this
# (see [keys] above).
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "switchboard.git"
description = "Git menu (Switchboard)"

# Projects picker (Switchboard): prefix+space opens the
# Rust TUI switcher over agents + workspaces + `ghq list`; the accept key chooses
# where a repo lands — enter default target, ^t tab, ^s split, ^o cd current pane
# — plus clone/update/remove. It no longer reaches the git menu: that is
# prefix+g above, and it is a separate pane.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "switchboard.projects"
description = "Projects picker (Switchboard)"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "switchboard.agents"
description = "Start an AI agent (Switchboard)"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "switchboard.usage"
description = "AI subscription usage (Switchboard)"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "switchboard.commands"
description = "Commands picker (Switchboard)"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "switchboard.ports"
description = "Ports picker (Switchboard)"

[[keys.command]]
key = "prefix+alt+e"
type = "plugin_action"
command = "switchboard.settings"
description = "Switchboard settings"

# prefix+z is herdr's own zoom, so zen takes prefix+alt+z.
[[keys.command]]
key = "prefix+alt+z"
type = "plugin_action"
command = "switchboard.zen-toggle"
description = "Toggle zen on this pane (Switchboard)"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "switchboard.clone"
description = "Clone repository (Switchboard)"

[[keys.command]]
key = "prefix+alt+u"
type = "plugin_action"
command = "switchboard.update"
description = "Update Switchboard"

[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "switchboard.changelog"
description = "Switchboard changelog"

[[keys.command]]
key = "prefix+alt+w"
type = "plugin_action"
command = "switchboard.open-workspace"
description = "Open repository in workspace (Switchboard)"

[[keys.command]]
key = "prefix+alt+t"
type = "plugin_action"
command = "switchboard.open-tab"
description = "Open repository in tab (Switchboard)"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "switchboard.open-split"
description = "Open repository in split (Switchboard)"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = true

agent_panel_sort = "priority"
accent = "#00CF6A"
show_agent_labels_on_pane_borders = false
[session]
resume_agents_on_restore = true

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[experimental]
allow_nested = false
pane_history = true
switch_ascii_input_source_in_prefix = true
kitty_graphics = true
