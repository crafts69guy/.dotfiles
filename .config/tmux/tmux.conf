# tmux is now a minimal fallback for remote/SSH-only boxes without herdr
# installed. herdr (https://herdr.dev) is the daily-driver multiplexer;
# see .config/herdr/config.toml. Plugins that only served that primary-driver
# role (hue-tmux, tmux-pain-control, tmux-yank, tmux-claude-session-manager)
# have been retired below — tpm and tmux-summarize remain.

# Enable 24 bit colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings
set-window-option -g mode-keys vi ## Open copy mode

# Copy-mode selection (tmux-yank retired along with the other
# primary-driver-only plugins; `y` now copies directly via pbcopy).
set -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Forward the prefix to nested tmux sessions (for example, the Claude popup).
# Use C-t C-t [ to enter copy mode in the nested session.
bind-key C-t send-prefix
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open current directory
bind F run-shell "open '#{pane_current_path}'"

# Kill panel
bind -r e kill-pane -a

#### basic settings

set -g mouse on

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
set-window-option -g mode-keys vi
#set-window-option -g utf8 on

set-option -g history-limit 64096

set -sg escape-time 10


# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/utility.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'crafts69guy/tmux-summarize'
run '~/.config/tmux/plugins/tpm/tpm'
